<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solex MES Dashboard</title>


    <!-- Bootstrap -->

    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" 
    rel="stylesheet">


    <!-- Dashboard CSS -->

    <link rel="stylesheet" href="css/dashboard.css">


</head>


<body>


<div class="wrapper">



<!-- ==============================
        SIDEBAR
================================ -->


<div class="sidebar">


    <div class="logo-section">


        <img src="images/logo.png" class="logo">


        <h4>Solex MES</h4>


    </div>



    <!-- Dynamic Menu -->

    <ul id="menuList">

    </ul>



</div>





<!-- ==============================
        MAIN CONTENT
================================ -->


<div class="main">



    <!-- TOP BAR -->


    <div class="topbar">


        <h2>
            Solex Manufacturing Execution System
        </h2>



        <div>


            <span id="dept"></span>


            <button 
            class="btn btn-danger ms-3"
            onclick="logout()">

                Logout

            </button>



        </div>


    </div>






<!-- ==============================
        KPI CARDS
================================ -->


<div class="row mt-4">



    <div class="col-md-3">


        <div class="card kpi shadow">


            <h5>
                Production
            </h5>


            <h2>
                12,450
            </h2>


        </div>


    </div>





    <div class="col-md-3">


        <div class="card kpi shadow">


            <h5>
                Yield
            </h5>


            <h2>
                98.20%
            </h2>


        </div>


    </div>






    <div class="col-md-3">


        <div class="card kpi shadow">


            <h5>
                Cell Rejection
            </h5>


            <h2>
                0.80%
            </h2>


        </div>


    </div>






    <div class="col-md-3">


        <div class="card kpi shadow">


            <h5>
                OEE
            </h5>


            <h2>
                88.50%
            </h2>


        </div>


    </div>



</div>









<!-- ==============================
        POWER BI REPORT
================================ -->


<div class="card mt-4 shadow">


    <div class="card-header bg-primary text-white">


        📊 Power BI Dashboard


    </div>




    <div class="card-body p-0">



        <iframe

            id="powerbiFrame"

            width="100%"

            height="850"

            style="border:0;"

            allowfullscreen="true">


        </iframe>



    </div>



</div>







</div>

<!-- END MAIN -->



</div>

<!-- END WRAPPER -->





<!-- Dashboard Script -->

<script src="js/dashboard.js"></script>



</body>

</html>
