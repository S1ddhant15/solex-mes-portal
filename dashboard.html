<!DOCTYPE html>
<html>

<head>

<title>Solex MES Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="dashboard">


<div class="dashboard-box">

<h1>Solex MES Portal</h1>

<h2 id="welcome"></h2>


<div class="cards">

<div class="card">
Production Dashboard
</div>


<div class="card">
Quality Dashboard
</div>


<div class="card">
Maintenance Dashboard
</div>


<div class="card">
Power BI Reports
</div>


</div>


<button onclick="logout()">
Logout
</button>


</div>


<script>

let dept = localStorage.getItem("userDepartment");

document.getElementById("welcome").innerHTML =
"Department : " + dept;


function logout(){

localStorage.clear();

window.location.href="index.html";

}

</script>


</body>

</html>
