<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solex MES Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="logo-section">

            <img src="images/logo.png" class="logo">

            <h4>Solex MES</h4>

        </div>

        <ul>

            <li><a href="#"><i class="bi bi-speedometer2"></i> Dashboard</a></li>

            <li><a href="#"><i class="bi bi-bar-chart"></i> Production</a></li>

            <li><a href="#"><i class="bi bi-check-circle"></i> Quality</a></li>

            <li><a href="#"><i class="bi bi-tools"></i> Maintenance</a></li>

            <li><a href="#"><i class="bi bi-cpu"></i> Process</a></li>

            <li><a href="#"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a></li>

            <li><a href="#"><i class="bi bi-gear"></i> Settings</a></li>

        </ul>

    </div>

    <!-- Main -->

    <div class="main">

        <div class="topbar">

            <h2>Solex Manufacturing Execution System</h2>

            <div>

                <span id="dept"></span>

                <button class="btn btn-danger ms-3" onclick="logout()">

                    Logout

                </button>

            </div>

        </div>

        <!-- KPI -->

        <div class="row mt-4">

            <div class="col-md-3">

                <div class="card kpi">

                    <h5>Production</h5>

                    <h2>12,450</h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card kpi">

                    <h5>Yield</h5>

                    <h2>98.20%</h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card kpi">

                    <h5>Cell Rejection</h5>

                    <h2>0.80%</h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card kpi">

                    <h5>OEE</h5>

                    <h2>88.50%</h2>

                </div>

            </div>

        </div>

        <!-- Power BI -->

        <div class="card mt-4 shadow">

            <div class="card-header bg-primary text-white">

                Power BI Dashboard

            </div>

            <div class="card-body">

                <iframe
                    src=""
                    width="100%"
                    height="600"
                    frameborder="0"
                    allowfullscreen>
                </iframe>

            </div>

        </div>

    </div>

</div>

<script src="js/dashboard.js"></script>

</body>

</html>
